[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "qqfrontier"
version         = "0.1.1"
description     = "Frontier quantile-on-quantile econometrics: QQ connectedness, cross-quantilogram, robust QQ causality, quantile coherency, QQARDL"
readme          = "README.md"
requires-python = ">=3.9"
license         = { text = "MIT" }
authors         = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
maintainers     = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
keywords        = ["econometrics", "quantile-on-quantile", "connectedness", "cross-quantilogram",
                   "quantile coherency", "Granger causality", "QARDL", "quantile regression"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.9",
  "pandas>=1.4",
  "matplotlib>=3.5",
  "statsmodels>=0.13",
]

[project.optional-dependencies]
plotly = ["plotly>=5.0"]
fast   = ["numba>=0.57", "joblib>=1.2"]
full   = ["plotly>=5.0", "numba>=0.57", "joblib>=1.2", "arch>=5.0"]
dev    = ["pytest>=7", "pytest-cov", "build", "twine", "ruff", "plotly>=5.0", "numba>=0.57", "joblib>=1.2", "arch>=5.0"]

[project.urls]
Homepage      = "https://merwanroudane.github.io/qqfrontier/"
PyPI          = "https://pypi.org/project/qqfrontier/"
Repository    = "https://github.com/merwanroudane/qqfrontier"
Documentation = "https://merwanroudane.github.io/qqfrontier/"
Issues        = "https://github.com/merwanroudane/qqfrontier/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qqfrontier"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "LICENSE", "CHANGELOG.md", "GUIDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running test"]
